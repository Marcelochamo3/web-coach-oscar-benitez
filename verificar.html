<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1B4332">
    <title>Verificación de Certificado | Oscar Benítez</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        forest: { 50: '#F1F7F4', 100: '#D8F3DC', 600: '#40916C', 700: '#2D6A4F', 800: '#1B4332', 900: '#0F291E' },
                        cream: '#FAFBF9',
                        earth: '#C8A97E',
                    },
                    fontFamily: { serif: ['Playfair Display', 'serif'], sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-cream text-forest-900 min-h-screen flex items-center justify-center p-4 font-sans">
    <div class="max-w-lg w-full bg-white rounded-3xl p-7 sm:p-10 border border-forest-100 shadow-xl text-center space-y-6">
        <div class="w-16 h-16 rounded-2xl bg-emerald-100 text-emerald-700 flex items-center justify-center mx-auto">
            <i data-lucide="shield-check" class="w-9 h-9"></i>
        </div>

        <div class="space-y-1">
            <span class="inline-block px-3 py-1 rounded-full bg-emerald-100 text-emerald-800 text-xs font-bold uppercase tracking-wider">Certificado Auténtico</span>
            <h1 class="font-serif text-2xl sm:text-3xl font-bold text-forest-900 pt-2">Validación Oficial</h1>
            <p class="text-xs text-forest-900/65">Registro Académico — Oscar Benítez | Coach Ontológico</p>
        </div>

        <div id="verify-details" class="bg-forest-50/70 border border-forest-100 rounded-2xl p-5 text-left space-y-3 text-sm">
            <div>
                <p class="text-[11px] uppercase font-bold text-forest-600">Otorgado a</p>
                <p id="v-name" class="font-bold text-base text-forest-900">—</p>
            </div>
            <div>
                <p class="text-[11px] uppercase font-bold text-forest-600">Curso Aprobado</p>
                <p id="v-course" class="font-semibold text-forest-900">—</p>
            </div>
            <div class="grid grid-cols-2 gap-3 pt-2 border-t border-forest-100">
                <div>
                    <p class="text-[11px] uppercase font-bold text-forest-600">Fecha</p>
                    <p id="v-date" class="font-medium text-forest-900">—</p>
                </div>
                <div>
                    <p class="text-[11px] uppercase font-bold text-forest-600">Código</p>
                    <p id="v-code" class="font-mono font-bold text-forest-800 text-xs">—</p>
                </div>
            </div>
        </div>

        <a href="index.html" class="inline-flex items-center justify-center gap-2 text-sm font-semibold text-forest-700 hover:text-forest-900">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            Volver a Oscar Benítez Coaching
        </a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) lucide.createIcons();
            const params = new URLSearchParams(window.location.search);
            document.getElementById('v-name').textContent = params.get('name') || 'Alumno Certificado';
            document.getElementById('v-course').textContent = params.get('course') || 'Programa de Coaching Ontológico';
            document.getElementById('v-date').textContent = params.get('date') || new Date().toLocaleDateString('es-AR');
            document.getElementById('v-code').textContent = params.get('code') || 'OB-2026-VERIFICADO';
        });
    </script>
</body>
</html>
